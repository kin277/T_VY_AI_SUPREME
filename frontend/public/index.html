<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>T.VỸ-AI-SUPREME v13.0 Ultra Pro Max</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@400;500;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK & WebSockets -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>

    <!-- Markdown & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>

    <div class="app-container" id="appContainer">
        <div class="drag-overlay" id="dragOverlay">
            <i class="fa-solid fa-cloud-arrow-up" style="margin-right:12px;"></i> Thả file vào đây để đính kèm
        </div>

        <!-- NƠI NỐI CÁC FILE GIAO DIỆN NHỎ (.HTML) -->
        <div id="sidebar-slot"></div>
        
        <main class="main">
            <div id="header-slot"></div>
            <div id="chat-slot" style="display: contents;"></div>
            <div id="toolbar-slot"></div>
            
            <footer class="footer">
                Bản quyền T.VỸ-VIP-FILE | Phiên bản 13.0 Ultra Modern Interface
            </footer>
        </main>
    </div>

    <!-- NƠI NỐI MODAL & PREVIEW -->
    <div id="modals-slot"></div>

    <!-- SCRIPT LOADER KẾT NỐI CÁC FILE UI NHỎ -->
    <script>
        async function loadComponent(slotId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    document.getElementById(slotId).innerHTML = await response.text();
                } else {
                    console.error(`Không thể tải component: ${filePath}`);
                }
            } catch (err) {
                console.error(`Lỗi kết nối file ${filePath}:`, err);
            }
        }

        // Khởi chạy nạp các component giao diện nhỏ
        window.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([
                loadComponent('sidebar-slot', 'components/sidebar/sidebar.html'),
                loadComponent('header-slot', 'components/header/header.html'),
                loadComponent('chat-slot', 'components/chat/chat.html'),
                loadComponent('toolbar-slot', 'components/toolbar/toolbar.html'),
                loadComponent('modals-slot', 'components/modals/modals.html')
            ]);

            // Nạp file JavaScript xử lý chính sau khi UI đã load đủ
            const script = document.createElement('script');
            script.src = 'js/app.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
